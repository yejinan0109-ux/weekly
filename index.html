<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 환경에서도 화면이 깨지지 않고 잘 보이게 하는 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 주간 루틴 트래커</title>
    <!-- 디자인을 쉽게 만들어주는 Tailwind CSS 라이브러리 불러오기 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 예쁜 폰트(Pretendard) 적용 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <!-- 아이콘을 사용하기 위한 FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f3f4f6; /* 연한 회색 배경 */
        }
        /* 체크박스 애니메이션 효과 */
        .checkbox-custom {
            transition: all 0.2s ease-in-out;
        }
        .task-item {
            transition: background-color 0.2s;
        }
        .task-item:hover {
            background-color: #f9fafb;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 text-gray-800">

    <!-- 앱 전체를 감싸는 하얀색 카드 영역 -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden">
        
        <!-- 헤더 영역 -->
        <div class="bg-indigo-600 p-6 text-white rounded-b-3xl shadow-md z-10 relative flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold mb-1">이번 주 나의 목표 ✨</h1>
                <p id="dateDisplay" class="text-indigo-200 text-sm font-medium">2023년 10월 25일 수요일</p>
            </div>
            <!-- 스케줄 설정 버튼 -->
            <button onclick="openSetupModal()" class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center hover:bg-white/30 transition-colors" title="스케줄 설정">
                <i class="fa-solid fa-pen text-white"></i>
            </button>
        </div>

        <div class="p-6">
            <!-- 요일 선택 탭 -->
            <div class="flex justify-between mb-6" id="dayTabs">
                <!-- 자바스크립트로 요일 버튼들이 여기에 채워집니다. -->
            </div>

            <!-- 진행률 표시 바 -->
            <div class="mb-6">
                <div class="flex justify-between text-sm font-semibold mb-2">
                    <span class="text-gray-500">오늘의 달성률</span>
                    <span id="progressText" class="text-indigo-600">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div id="progressBar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                </div>
            </div>

            <!-- 할 일 목록 영역 -->
            <div id="taskList" class="space-y-3 min-h-[250px]">
                <!-- 자바스크립트로 할 일 목록이 여기에 채워집니다. -->
            </div>
        </div>
        
    </div>

    <!-- 스케줄 설정 모달 (초기에는 숨김 처리) -->
    <div id="setupModal" style="display: none;" class="fixed inset-0 bg-black/60 z-50 items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <!-- 모달 헤더 -->
            <div class="p-5 bg-indigo-50 border-b border-indigo-100 flex justify-between items-center">
                <h2 class="text-xl font-bold text-indigo-800">내 스케줄 설정하기 ✍️</h2>
                <button onclick="closeSetupModal()" class="text-gray-400 hover:text-gray-800 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <!-- 모달 콘텐츠 -->
            <div class="p-5 overflow-y-auto flex-grow flex flex-col">
                <p class="text-xs text-gray-500 text-center mb-4">요일을 선택하고 매주 반복할 할 일을 자유롭게 추가해 보세요.</p>
                
                <!-- 설정용 요일 탭 -->
                <div class="flex justify-between mb-5" id="setupDayTabs">
                </div>

                <!-- 새 할 일 입력 폼 -->
                <div class="flex mb-5">
                    <input type="text" id="newTaskInput" class="flex-grow border border-gray-300 rounded-l-xl p-3 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500" placeholder="예: 아침 조깅 30분">
                    <button onclick="addCurrentTask()" class="bg-indigo-600 text-white px-5 rounded-r-xl font-bold hover:bg-indigo-700 transition-colors whitespace-nowrap">추가</button>
                </div>

                <!-- 해당 요일의 할 일 목록 -->
                <ul id="setupTaskList" class="space-y-2 mb-2 flex-grow min-h-[150px] max-h-[250px] overflow-y-auto pr-1">
                </ul>
            </div>
            
            <!-- 모달 하단 버튼 -->
            <div class="p-4 bg-gray-50 border-t border-gray-100 text-center">
                <button onclick="closeSetupModal()" class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl shadow hover:bg-indigo-700 transition-colors">저장하고 화면으로 돌아가기</button>
            </div>
        </div>
    </div>

    <!-- 앱의 동작을 제어하는 자바스크립트 -->
    <script>
        // 💡 브라우저 저장소(localStorage)에서 개인 스케줄 데이터를 불러옵니다.
        let scheduleData = JSON.parse(localStorage.getItem('myTracker_schedule'));
        
        // 처음 접속했거나 데이터가 없다면 빈 스케줄 틀을 생성합니다.
        if (!scheduleData) {
            scheduleData = {
                0: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: []
            };
        }

        const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
        
        // 상태 변수들 (현재 선택된 요일, 완료된 할일 목록)
        let currentDayIndex = new Date().getDay(); // 오늘 요일을 기본값으로 (0~6)
        
        // 브라우저 저장소(localStorage)에서 기존에 체크한 데이터를 불러옵니다.
        let completedTasks = JSON.parse(localStorage.getItem('myTracker_completed')) || [];

        // 앱 초기화 함수 (맨 처음 실행됨)
        function initApp() {
            displayTodayDate();
            renderDayTabs();
            renderTasks(currentDayIndex);

            // 모든 요일의 일정이 비어있는지 확인 (처음 접속 여부)
            let isEmpty = true;
            for(let i = 0; i < 7; i++) {
                if(scheduleData[i] && scheduleData[i].length > 0) isEmpty = false;
            }
            
            // 처음 접속해서 데이터가 완전히 비어있으면 스케줄 설정 모달을 자동으로 엽니다.
            if(isEmpty) {
                openSetupModal();
            }
        }

        // 헤더에 오늘 날짜 표시하기
        function displayTodayDate() {
            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth() + 1;
            const date = today.getDate();
            const dayName = dayNames[today.getDay()];
            
            document.getElementById('dateDisplay').textContent = `${year}년 ${month}월 ${date}일 ${dayName}요일`;
        }

        // 요일 탭 그리기
        function renderDayTabs() {
            const tabsContainer = document.getElementById('dayTabs');
            tabsContainer.innerHTML = ''; // 기존 내용 지우기

            dayNames.forEach((day, index) => {
                const btn = document.createElement('button');
                const isSelected = index === currentDayIndex;
                
                // 선택된 요일과 선택되지 않은 요일의 디자인 다르게 설정
                btn.className = `w-10 h-10 rounded-full font-bold text-sm transition-colors duration-200 
                    ${isSelected 
                        ? 'bg-indigo-600 text-white shadow-md' 
                        : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`;
                btn.textContent = day;
                
                // 요일 버튼 클릭 시 동작
                btn.onclick = () => {
                    currentDayIndex = index;
                    renderDayTabs(); // 탭 디자인 다시 그리기 (선택된 요일 하이라이트)
                    renderTasks(index); // 해당 요일의 할 일 목록 그리기
                };
                
                tabsContainer.appendChild(btn);
            });
        }

        // 특정 요일의 할 일 목록 그리기
        function renderTasks(dayIndex) {
            const listContainer = document.getElementById('taskList');
            listContainer.innerHTML = '';
            
            const tasks = scheduleData[dayIndex] || [];
            
            if (tasks.length === 0) {
                listContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-48 text-gray-400">
                        <i class="fa-solid fa-mug-hot text-4xl mb-3"></i>
                        <p>오늘은 일정이 없습니다. 푹 쉬세요!</p>
                    </div>`;
                updateProgress(0, 0);
                return;
            }

            let completedCount = 0;

            tasks.forEach(task => {
                const isCompleted = completedTasks.includes(task.id);
                if (isCompleted) completedCount++;

                const taskElement = document.createElement('div');
                taskElement.className = `task-item flex items-center p-4 border rounded-xl cursor-pointer ${isCompleted ? 'bg-gray-50 border-gray-200' : 'bg-white border-gray-200 shadow-sm'}`;
                
                // 항목 클릭 시 체크박스 토글
                taskElement.onclick = () => toggleTask(task.id);

                taskElement.innerHTML = `
                    <div class="flex-shrink-0 mr-4">
                        <div class="checkbox-custom w-6 h-6 rounded-full border-2 flex items-center justify-center
                            ${isCompleted ? 'bg-indigo-500 border-indigo-500' : 'border-gray-300'}">
                            <i class="fa-solid fa-check text-white text-xs ${isCompleted ? 'opacity-100' : 'opacity-0'}"></i>
                        </div>
                    </div>
                    <div class="flex-grow">
                        <p class="text-base font-medium ${isCompleted ? 'text-gray-400 line-through' : 'text-gray-700'}">
                            ${task.text}
                        </p>
                    </div>
                `;
                listContainer.appendChild(taskElement);
            });

            updateProgress(completedCount, tasks.length);
        }

        // 할 일 체크 / 체크해제 처리
        function toggleTask(taskId) {
            if (completedTasks.includes(taskId)) {
                // 이미 체크된 경우 -> 목록에서 제거 (체크 해제)
                completedTasks = completedTasks.filter(id => id !== taskId);
            } else {
                // 체크 안된 경우 -> 목록에 추가 (체크 완료)
                completedTasks.push(taskId);
            }
            
            // 변경된 상태를 브라우저에 저장하여 새로고침해도 유지되게 함
            localStorage.setItem('myTracker_completed', JSON.stringify(completedTasks));
            
            // 화면 다시 그리기
            renderTasks(currentDayIndex);
        }

        // 진행률 바 업데이트
        function updateProgress(completed, total) {
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            
            if (total === 0) {
                progressBar.style.width = '0%';
                progressText.textContent = '0%';
                return;
            }

            const percentage = Math.round((completed / total) * 100);
            progressBar.style.width = `${percentage}%`;
            progressText.textContent = `${percentage}%`;
            
            // 100% 달성 시 색상 변경 효과
            if (percentage === 100) {
                progressBar.classList.remove('bg-indigo-600');
                progressBar.classList.add('bg-green-500');
                progressText.classList.remove('text-indigo-600');
                progressText.classList.add('text-green-500');
            } else {
                progressBar.classList.add('bg-indigo-600');
                progressBar.classList.remove('bg-green-500');
                progressText.classList.add('text-indigo-600');
                progressText.classList.remove('text-green-500');
            }
        }

        // ==========================================
        // ⚙️ 스케줄 설정(모달) 관련 함수들
        // ==========================================
        let setupDayIndex = 1; // 설정 창의 기본 요일

        // 모달 열기
        function openSetupModal() {
            document.getElementById('setupModal').style.display = 'flex';
            setupDayIndex = currentDayIndex; // 현재 메인 화면에서 보고 있는 요일을 기본으로 띄움
            renderSetupTabs();
            renderSetupTasks();
            
            // 엔터키 이벤트 리스너 등록 (최초 1회만)
            const input = document.getElementById('newTaskInput');
            if(!input.dataset.listener) {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') addCurrentTask();
                });
                input.dataset.listener = 'true';
            }
        }

        // 모달 닫기
        function closeSetupModal() {
            document.getElementById('setupModal').style.display = 'none';
            renderTasks(currentDayIndex); // 설정한 내용이 바로 반영되도록 메인 화면 다시 그리기
        }

        // 설정 창 내부의 요일 탭 그리기
        function renderSetupTabs() {
            const tabsContainer = document.getElementById('setupDayTabs');
            tabsContainer.innerHTML = '';

            dayNames.forEach((day, index) => {
                const btn = document.createElement('button');
                const isSelected = index === setupDayIndex;
                btn.className = `w-10 h-10 rounded-full font-bold text-sm transition-colors duration-200 
                    ${isSelected ? 'bg-indigo-600 text-white shadow-md' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`;
                btn.textContent = day;
                btn.onclick = () => {
                    setupDayIndex = index;
                    renderSetupTabs();
                    renderSetupTasks();
                };
                tabsContainer.appendChild(btn);
            });
        }

        // 설정 창 내부의 할 일 목록 그리기
        function renderSetupTasks() {
            const list = document.getElementById('setupTaskList');
            list.innerHTML = '';
            
            const tasks = scheduleData[setupDayIndex] || [];
            if(tasks.length === 0) {
                list.innerHTML = `
                    <li class="text-center text-gray-400 py-8 text-sm bg-gray-50 rounded-xl border border-dashed border-gray-200">
                        추가된 일정이 없습니다.<br>아래 입력창에서 할 일을 추가해 보세요!
                    </li>`;
                return;
            }

            tasks.forEach(task => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center p-3 bg-white border border-gray-200 rounded-lg shadow-sm';
                li.innerHTML = `
                    <span class="text-gray-700 break-all pr-3">${task.text}</span>
                    <button onclick="removeSetupTask('${task.id}')" class="text-red-400 hover:text-red-600 p-1 flex-shrink-0 transition-colors" title="삭제하기">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
                list.appendChild(li);
            });
        }

        // 새 할 일 추가 로직
        function addCurrentTask() {
            const input = document.getElementById('newTaskInput');
            const text = input.value.trim();
            if(!text) return; // 빈칸이면 추가하지 않음
            
            // 고유한 ID 생성 (현재 시간 기반)
            const newId = 'task_' + Date.now();
            
            if(!scheduleData[setupDayIndex]) scheduleData[setupDayIndex] = [];
            scheduleData[setupDayIndex].push({ id: newId, text: text });
            
            input.value = ''; // 입력창 초기화
            saveScheduleData(); // 브라우저에 즉시 저장
            renderSetupTasks(); // 목록 다시 그리기
        }

        // 할 일 삭제 로직
        function removeSetupTask(taskId) {
            scheduleData[setupDayIndex] = scheduleData[setupDayIndex].filter(t => t.id !== taskId);
            
            // 삭제한 일정이 완료(체크) 목록에도 있었다면 그곳에서도 지워줌
            completedTasks = completedTasks.filter(id => id !== taskId);
            localStorage.setItem('myTracker_completed', JSON.stringify(completedTasks));

            saveScheduleData();
            renderSetupTasks();
        }

        // 전체 스케줄 저장하기
        function saveScheduleData() {
            localStorage.setItem('myTracker_schedule', JSON.stringify(scheduleData));
        }

        // 페이지가 다 로드되면 앱 시작!
        window.onload = initApp;

    </script>
</body>
</html>
